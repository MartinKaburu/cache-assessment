options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # Step 1: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'us-east1-docker.pkg.dev/cache-assessment/cache-assessment-repo/cache-assessment-app:$SHORT_SHA-$_ENV', './app']

  # Step 2: Push Docker image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-east1-docker.pkg.dev/cache-assessment/cache-assessment-repo/cache-assessment-app:$SHORT_SHA-$_ENV']

  # Step 3: Deploy to GKE using kubectl and kustomize
  - name: 'gcr.io/cloud-builders/kubectl'
    env:
      - 'CLOUDSDK_COMPUTE_REGION=${_CLUSTER_REGION}'
      - 'CLOUDSDK_CONTAINER_CLUSTER=${_CLUSTER_NAME}'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        kubectl kustomize k8s/overlays/${_ENV} | kubectl apply -f -


substitutions:
  _CLUSTER_NAME: 'cache-assessment-cluster'
  _CLUSTER_REGION: 'us-east1'
  _ENV: 'staging'

timeout: '900s'